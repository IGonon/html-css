    <title>Combinadores</title>
    <link rel="stylesheet" href="style26.css">
</head>
<body>
    <!--
        combinators = explica la relacion entre los selectores listados
            = descendant
            > = child
            ~ = general sibling
            + = adjacent sibling
    -->

    <div id="container">
        <p>Esto es el #1</p>
        <p>Esto es el #2</p>
        <div>
            <p>Esto es el #3</p>
        </div>
    </div>

    <p>Esto es el #4</p>
    <p>Esto es el #5</p>

</body>
